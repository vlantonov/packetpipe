name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libcap-dev

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake --preset release
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libcap-dev gcovr

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake --preset coverage
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Coverage report
        run: >
          gcovr --root . --filter src/
          --exclude src/main\.cpp
          --exclude src/kafka/kafka_producer\.cpp
          --exclude src/kafka/avro_kafka_sink\.cpp
          --exclude src/metrics/metrics_registry\.cpp
          --exclude src/packets/live_capture_source\.cpp
          --exclude src/avro/schema_registry_client\.cpp
          --exclude-unreachable-branches
          --fail-under-line 70
          --txt
          -j $(nproc)
          build/coverage
        # Files above require live Kafka/Prometheus/libpcap infra; excluded so
        # the 70% gate reflects testable core logic only.
